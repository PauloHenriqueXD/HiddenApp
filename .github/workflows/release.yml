# Publica uma versão nova do HiddenApp no GitHub Releases.
#
# Duas formas de publicar:
#  1) Pelo site (sem precisar de Git): aba Actions > "Publicar versão" > Run workflow,
#     digite a versão (ex.: 1.2.0 ou 1.2.0-beta.1). A tag é criada automaticamente.
#  2) Por tag:  git tag v1.2.0 && git push origin v1.2.0
#     (sufixo -beta.N = versão beta / pré-lançamento)
#
# O GitHub compila no Windows, gera o HiddenApp.exe (arquivo único, com .NET incluso),
# calcula o SHA-256 e cria a Release com as novidades tiradas do CHANGELOG.md.
# O HiddenApp instalado nos PCs encontra a versão nova e pergunta se o usuário quer atualizar.

name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar, sem o "v" (ex.: 1.2.0 ou 1.2.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ler a versão
        id: ver
        shell: pwsh
        env:
          EVENTO: ${{ github.event_name }}
          VERSAO_DIGITADA: ${{ inputs.versao }}
          REF: ${{ github.ref_name }}
        run: |
          if ($env:EVENTO -eq 'workflow_dispatch') {
            $ver = $env:VERSAO_DIGITADA.Trim().TrimStart('v', 'V')
            $tag = "v$ver"
            if (git ls-remote --tags origin "refs/tags/$tag") {
              Write-Error "A tag $tag já existe. Use outro número de versão."
              exit 1
            }
          } else {
            $tag = $env:REF
            $ver = $tag.TrimStart('v')
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "A tag '$tag' não está no formato v1.2.3 ou v1.2.3-beta.1"
            exit 1
          }
          $pre = if ($ver.Contains('-')) { 'true' } else { 'false' }
          "tag=$tag"        >> $env:GITHUB_OUTPUT
          "version=$ver"    >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver  (beta: $pre)"

      - name: Gerar o executável
        run: dotnet publish HiddenApp.csproj -p:PublishProfile=Portatil -p:Version=${{ steps.ver.outputs.version }}

      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/HiddenApp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HiddenApp.exe" | Out-File -FilePath publish/HiddenApp.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Montar as novidades (CHANGELOG.md)
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $header = '^## \[' + [regex]::Escape($ver) + '\]'
          $out = @(); $inside = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              if ($line -match $header) { $inside = $true }
              continue
            }
            if ($inside -and $line -notmatch '^\[[^\]]+\]: ') { $out += $line }
          }
          $text = ($out -join "`n").Trim()
          if (-not $text) { $text = "Versão $ver." }
          $text | Out-File -FilePath notes.md -Encoding utf8

      - name: Criar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pelo botão, a tag é criada aqui, apontando para o commit compilado
          $ghArgs = @(
            'release', 'create', '${{ steps.ver.outputs.tag }}',
            '--target', '${{ github.sha }}',
            'publish/HiddenApp.exe', 'publish/HiddenApp.exe.sha256',
            '--title', 'HiddenApp ${{ steps.ver.outputs.version }}',
            '--notes-file', 'notes.md'
          )
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
